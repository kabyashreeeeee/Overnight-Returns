seed: 42

paths:
  daily_dir: ../data/daily
  minute_dir: ../data/minute
  minute_cache: ../cache/minute_features.parquet     # reused, raw-data-derived, leakage-audited
  output_dir: outputs

data:
  start_date: "2020-06-01"
  end_date: "2026-06-30"

splits:
  train_end: "2024-03-31"
  valid_end: "2025-04-30"
  embargo_sessions: 5

# Inner expanding-window OOF folds, built entirely inside the training block.
oof:
  n_folds: 5
  reserve_sessions: 657        # final training sessions used for OOF generation
  embargo_sessions: 5

features:
  min_history_sessions: 20     # burn-in before a row is scorable
  minute_coverage_floor: 0.80
  expected_minute_bars: 375
  rebuild_minute_cache: false

magnitude:
  ridge_alphas: [10.0, 100.0, 1000.0, 10000.0]
  lgbm:
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 5.0
    n_jobs: 8
  tweedie_powers: [1.1, 1.3, 1.5]
  mean_gate:
    max_mean_gap_pct: 5.0      # |mean(pred)/mean(actual) - 1| in percent
    slope_low: 0.7
    slope_high: 1.4

direction:
  market_ridge_alphas: [100.0, 300.0, 1000.0, 3000.0, 10000.0]
  residual_lgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 5.0
    n_jobs: 8
  shrinkage_grid: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25]

quantiles:
  levels: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95]
  lgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 300
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: 8

bootstrap:
  block_sessions: 5
  draws: 2000
